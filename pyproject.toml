[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "separser"
version = "0.1.0"
description = "StreetEasy listing parser — MCP tool for Claude Desktop"
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.44",
    "playwright-stealth>=2.0",
    "pydantic>=2.0",
    "mcp>=1.0",
    "rich>=13.0",
    "beautifulsoup4>=4.12",
]

[project.scripts]
separser-mcp = "separser.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["separser"]
